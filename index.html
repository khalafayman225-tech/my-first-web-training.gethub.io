<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body class="bg-900">
    <div class="bg-800 card">
      <div class="container">
        <img class="image-equilibrium" src="images/image-equilibrium.jpg" alt="image-equilibrium" />
        <div class="middle">
          <img class="eye" src="images/icon-view.svg" alt="eye">
        </div>
      </div>
      <div class="text-accent-100 fw-bold padding | anime card-head">
        <h1>Equilibrium #3429</h1>
      </div>
      <div class="text-primary-500 fw-regular padding | card-info">
        <p>Our Equilibrium collection promotes balance and calm.</p>
      </div>
      <div class="fw-simi-bold | variable-data">
        <div class="text-primary-400 | ETH"><img src="images/icon-ethereum.svg" alt="ETH"><p><span>0.041</span>ETH</p></div>
        <div class="text-primary-500 | days"><img src="images/icon-clock.svg" alt="clock"><p><span>3</span> days left</p></div>
      </div>
      <div class="text-primary-500 fw-regular | creator">
        <img class="image-avatar " src="images/image-avatar.png" alt="image-avatar">
        <div class="creator-name">
          <p>Creation of <span class="text-accent-100 anime fw-simi-bold">Jules Wyvern</span></p>
        </div>
      </div>
    </div>
  </body>
</html>
